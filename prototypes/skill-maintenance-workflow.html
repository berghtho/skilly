<!--
  THROWAWAY PROTOTYPE - NOT PRODUCTION CODE.
  Three maintenance-workflow UI variants, switchable with ?variant=A|B|C.
  State is intentionally in memory only; all provider and file operations are mocked.
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skilly maintenance workflow prototype</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f3ed;
      --panel: #fbfaf5;
      --ink: #171914;
      --muted: #686a62;
      --line: #c9c9bf;
      --line-dark: #8b8d83;
      --accent: #b7f000;
      --accent-dark: #678a00;
      --warn: #f26a21;
      --danger: #a53224;
      --selection: #e8f8b4;
      --shadow: 0 8px 24px rgba(24, 27, 18, .16);
      font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
      font-size: 14px;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; color: var(--ink); background: var(--paper); }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    :focus-visible { outline: 3px solid var(--accent-dark); outline-offset: 2px; }
    input[type="checkbox"] { accent-color: var(--accent-dark); }

    .app { min-height: 100vh; padding-bottom: 88px; }
    .titlebar {
      height: 39px; display: flex; align-items: center; gap: 9px; padding: 0 14px;
      color: #fff; background: var(--ink); border-bottom: 1px solid #000;
    }
    .app-mark { width: 16px; height: 16px; background: var(--accent); border: 1px solid #d7ff50; }
    .titlebar strong { letter-spacing: .01em; }
    .titlebar .prototype-tag { margin-left: auto; color: #d9dbd2; font-size: 12px; }

    .commandbar {
      min-height: 48px; display: flex; align-items: center; gap: 8px; padding: 7px 12px;
      background: var(--panel); border-bottom: 1px solid var(--line-dark);
    }
    .commandbar .source-entry { flex: 1; display: flex; gap: 6px; min-width: 260px; }
    .commandbar input, .search-box, .source-task input, .inspector input {
      min-height: 31px; width: 100%; padding: 5px 8px; border: 1px solid var(--line-dark);
      border-radius: 2px; background: #fff;
    }
    .btn {
      min-height: 31px; padding: 5px 11px; border: 1px solid var(--line-dark);
      border-radius: 2px; background: #fff; white-space: nowrap;
    }
    .btn:hover:not(:disabled) { background: #eeeee7; border-color: #55584f; }
    .btn.primary { background: var(--accent); border-color: #6b8f00; font-weight: 650; }
    .btn.primary:hover:not(:disabled) { background: #a9dc00; }
    .btn.danger { color: var(--danger); border-color: #bf786e; }
    .btn.dark { color: #fff; background: var(--ink); border-color: #000; }
    .btn.small { min-height: 26px; padding: 3px 8px; font-size: 12px; }
    .btn.linkish { padding-inline: 3px; border-color: transparent; background: transparent; text-decoration: underline; }

    .operation-strip {
      min-height: 30px; display: flex; align-items: center; gap: 8px; padding: 5px 12px;
      background: #eef8cf; border-bottom: 1px solid #adc35e; font-size: 12px;
    }
    .operation-strip .op-label { font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
    .operation-strip time { margin-left: auto; color: var(--muted); }
    .provider-note { color: #75411e; }

    .status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; }
    .status::before { content: ""; width: 7px; height: 7px; border: 1px solid currentColor; background: currentColor; }
    .status.good { color: #477000; }
    .status.info { color: #315f87; }
    .status.warn { color: #a64716; }
    .status.bad { color: var(--danger); }
    .status.neutral { color: #65675f; }
    .tag { display: inline-block; padding: 1px 5px; border: 1px solid var(--line); border-radius: 2px; font-size: 11px; background: #fff; }
    .tag.accent { border-color: #86aa16; background: #efffbd; }
    .tag.warn { border-color: #dc8b5e; background: #fff0e7; }
    .mono { font-family: "Cascadia Mono", Consolas, monospace; font-size: .92em; }
    .muted { color: var(--muted); }
    .eyebrow { margin: 0 0 5px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .section-heading { margin: 0; font-size: 15px; }
    .empty { padding: 28px 16px; color: var(--muted); text-align: center; }

    /* Variant A: Workbench */
    .workbench { display: grid; grid-template-columns: 136px minmax(500px, 1fr) 340px; min-height: calc(100vh - 117px); }
    .filter-rail { padding: 10px 8px; border-right: 1px solid var(--line-dark); background: #ecece5; }
    .filter-rail h2 { margin: 2px 7px 9px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; }
    .filter-button {
      width: 100%; display: flex; justify-content: space-between; gap: 8px; padding: 7px 8px;
      border: 1px solid transparent; background: transparent; text-align: left;
    }
    .filter-button:hover { border-color: var(--line); background: #f8f8f2; }
    .filter-button.active { border-color: #89a934; background: var(--selection); font-weight: 650; }
    .rail-rule { margin: 12px 5px; border: 0; border-top: 1px solid var(--line); }
    .rail-meta { padding: 0 7px; font-size: 11px; line-height: 1.5; color: var(--muted); }
    .inventory-pane { min-width: 0; background: var(--panel); }
    .inventory-tools { display: flex; align-items: center; gap: 8px; min-height: 45px; padding: 7px 9px; border-bottom: 1px solid var(--line); }
    .inventory-tools .search-box { flex: 1; }
    .inventory-tools .count { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .inventory-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .inventory-table th {
      height: 30px; padding: 4px 7px; border-bottom: 1px solid var(--line-dark); border-right: 1px solid var(--line);
      background: #e7e7df; color: #383a34; font-size: 11px; text-align: left; text-transform: uppercase; letter-spacing: .04em;
    }
    .inventory-table th button { width: 100%; padding: 0; border: 0; background: transparent; text-align: left; font: inherit; text-transform: inherit; }
    .inventory-table td { height: 47px; padding: 5px 7px; border-bottom: 1px solid #deded5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .inventory-table tbody tr { cursor: pointer; }
    .inventory-table tbody tr:hover { background: #f1f2e8; }
    .inventory-table tbody tr.selected { background: var(--selection); box-shadow: inset 3px 0 var(--accent-dark); }
    .skill-cell strong, .skill-cell span { display: block; overflow: hidden; text-overflow: ellipsis; }
    .skill-cell span { color: var(--muted); font-size: 11px; }
    .harness-marks { display: flex; gap: 3px; }
    .harness-mark { width: 19px; height: 18px; display: grid; place-items: center; border: 1px solid var(--line); color: #8d8f87; font-size: 10px; }
    .harness-mark.on { color: var(--ink); border-color: #7a8a48; background: #edfac7; font-weight: 700; }
    .details-pane { border-left: 1px solid var(--line-dark); background: #f8f7f1; }
    .details-head { padding: 13px 14px 10px; border-bottom: 1px solid var(--line); }
    .details-head h2 { margin: 2px 0 3px; font-size: 20px; font-weight: 600; }
    .details-body { padding: 12px 14px; }
    .description { margin: 0 0 15px; line-height: 1.45; }
    .fact-list { margin: 0 0 15px; }
    .fact-list div { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 8px; padding: 6px 0; border-top: 1px solid #deded5; }
    .fact-list dt { color: var(--muted); }
    .fact-list dd { margin: 0; overflow-wrap: anywhere; }
    .harness-list { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin: 7px 0 15px; }
    .harness-line { padding: 5px 6px; border: 1px solid var(--line); background: #fff; font-size: 12px; }
    .harness-line.on { border-left: 3px solid var(--accent-dark); }
    .action-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .confirm-step { margin-top: 13px; padding: 10px; border: 1px solid var(--warn); background: #fff5ed; }
    .confirm-step strong { display: block; margin-bottom: 5px; }

    /* Variant B: Action Queue */
    .queue-shell { max-width: 1060px; margin: 0 auto; padding: 18px 20px 92px; }
    .queue-header { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 13px; }
    .queue-header h1 { margin: 0; font-size: 25px; font-weight: 600; }
    .queue-header p { margin: 4px 0 0; color: var(--muted); }
    .queue-header .refresh-block { text-align: right; }
    .source-task { display: grid; grid-template-columns: 155px 1fr auto; align-items: center; gap: 10px; padding: 13px; border: 1px solid #6d820c; border-left: 7px solid var(--accent); background: #fafdef; }
    .source-task strong { display: block; }
    .source-task small { color: var(--muted); }
    .queue-controls { display: flex; align-items: center; gap: 10px; margin: 16px 0 7px; }
    .queue-controls .search-box { max-width: 360px; }
    .queue-section { margin-top: 17px; border-top: 2px solid var(--ink); }
    .queue-section-title { display: flex; align-items: baseline; gap: 9px; padding: 7px 2px; }
    .queue-section-title h2 { margin: 0; font-size: 16px; }
    .queue-section-title span { color: var(--muted); font-size: 12px; }
    .queue-item { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 11px 9px; border-top: 1px solid var(--line); background: var(--panel); }
    .queue-item:last-child { border-bottom: 1px solid var(--line); }
    .queue-item:hover, .queue-item.selected { background: #f1f8dc; }
    .queue-item.selected { box-shadow: inset 4px 0 var(--accent-dark); }
    .queue-summary { min-width: 0; cursor: pointer; }
    .queue-summary h3 { display: inline; margin: 0 7px 0 0; font-size: 15px; }
    .queue-summary p { margin: 4px 0 0; color: #50524b; line-height: 1.35; }
    .queue-summary .meta { margin-top: 5px; color: var(--muted); font-size: 11px; }
    .queue-actions { display: flex; align-items: center; gap: 6px; }
    .queue-detail { grid-column: 1 / -1; display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; margin: 0 -9px -11px; padding: 12px 14px; border-top: 1px dashed var(--line-dark); background: #fff; }
    .queue-detail .facts-inline { display: grid; grid-template-columns: 100px 1fr; gap: 4px 8px; font-size: 12px; }
    .healthy-stack { border: 1px solid var(--line); background: var(--panel); }
    .healthy-row { display: grid; grid-template-columns: minmax(150px, 1fr) 170px 120px auto; align-items: center; gap: 8px; min-height: 37px; padding: 4px 8px; border-top: 1px solid #e0e0d8; cursor: pointer; }
    .healthy-row:first-child { border-top: 0; }
    .healthy-row:hover, .healthy-row.selected { background: var(--selection); }

    /* Variant C: Source Ledger */
    .ledger-shell { max-width: 1180px; margin: 0 auto; padding: 14px 18px 96px; }
    .ledger-header { display: grid; grid-template-columns: 1fr minmax(340px, 560px); gap: 24px; align-items: end; margin-bottom: 13px; }
    .ledger-header h1 { margin: 0; font-size: 24px; font-weight: 600; }
    .ledger-header p { margin: 4px 0 0; color: var(--muted); }
    .ledger-add { display: flex; gap: 6px; }
    .ledger-tools { display: flex; align-items: center; gap: 7px; padding: 7px 0; border-top: 1px solid var(--line-dark); border-bottom: 1px solid var(--line-dark); }
    .ledger-tools .search-box { max-width: 330px; }
    .ledger-tools .provider-note { margin-left: auto; font-size: 12px; }
    .ledger-column-head { display: grid; grid-template-columns: minmax(250px, 1.3fr) minmax(180px, .8fr) 135px 110px; gap: 12px; padding: 6px 10px; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
    .source-group { border-top: 1px solid var(--ink); }
    .source-group:last-child { border-bottom: 1px solid var(--ink); }
    .source-head { width: 100%; display: grid; grid-template-columns: minmax(250px, 1.3fr) minmax(180px, .8fr) 135px 110px; gap: 12px; align-items: center; padding: 10px; border: 0; background: #e9e9e1; text-align: left; }
    .source-head:hover { background: #dfdfd6; }
    .source-title { min-width: 0; }
    .source-title strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .source-title small { color: var(--muted); }
    .source-head .check-cell { display: flex; align-items: center; gap: 8px; }
    .twisty { width: 18px; font-family: Consolas, monospace; }
    .source-skills { background: var(--panel); }
    .source-skill { display: grid; grid-template-columns: 28px minmax(220px, 1.3fr) minmax(180px, .8fr) 135px 110px; gap: 12px; align-items: center; min-height: 49px; padding: 5px 10px; border-top: 1px solid #d8d8cf; cursor: pointer; }
    .source-skill:hover, .source-skill.selected { background: var(--selection); }
    .source-skill.selected { box-shadow: inset 4px 0 var(--accent-dark); }
    .source-skill .branch-line { align-self: stretch; border-left: 1px solid #9b9d94; border-bottom: 1px solid #9b9d94; margin-bottom: 23px; }
    .ledger-detail { display: grid; grid-template-columns: 1fr 1.1fr auto; gap: 18px; align-items: start; padding: 13px; border: 1px solid var(--line-dark); border-top: 0; background: #fff; }
    .ledger-detail h2 { margin: 0 0 4px; font-size: 18px; }
    .ledger-detail p { margin: 0; line-height: 1.4; }
    .ledger-detail .ledger-facts { font-size: 12px; line-height: 1.65; overflow-wrap: anywhere; }
    .ledger-detail .action-row { justify-content: end; margin: 0; max-width: 235px; }

    /* Source inspection */
    .scrim { position: fixed; inset: 0; z-index: 20; background: rgba(18, 20, 15, .44); }
    .inspector {
      position: fixed; z-index: 21; top: 7vh; right: 4vw; bottom: 86px; width: min(690px, 92vw);
      display: flex; flex-direction: column; border: 1px solid #000; background: var(--panel); box-shadow: var(--shadow);
    }
    .inspector-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; color: #fff; background: var(--ink); }
    .inspector-head h2 { margin: 0; font-size: 17px; }
    .inspector-head button { margin-left: auto; color: #fff; border-color: #73766c; background: #282b24; }
    .inspector-form { display: grid; grid-template-columns: 1fr auto; gap: 6px; padding: 12px; border-bottom: 1px solid var(--line); }
    .inspection-summary { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: #eef8cf; }
    .inspection-summary strong { font-size: 16px; }
    .inspection-summary .spacer { flex: 1; }
    .candidate-list { flex: 1; overflow: auto; }
    .candidate-row { display: grid; grid-template-columns: 26px minmax(150px, .8fr) minmax(180px, 1fr) 95px; gap: 8px; align-items: center; padding: 7px 12px; border-bottom: 1px solid #deded5; }
    .candidate-row:hover { background: #f1f2e8; }
    .candidate-row label { display: contents; }
    .candidate-row small { color: var(--muted); overflow-wrap: anywhere; }
    .inspector-empty { flex: 1; display: grid; place-items: center; padding: 35px; text-align: center; }
    .inspector-empty strong { display: block; margin-bottom: 6px; font-size: 18px; }
    .inspector-foot { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line-dark); background: #e9e9e1; }
    .inspector-foot .provider-note { flex: 1; font-size: 12px; }

    .switcher {
      position: fixed; z-index: 40; left: 50%; bottom: 14px; transform: translateX(-50%);
      display: grid; grid-template-columns: 38px minmax(270px, 430px) 38px; align-items: stretch;
      border: 1px solid #000; border-radius: 4px; color: #fff; background: var(--ink); box-shadow: var(--shadow);
    }
    .switcher button { border: 0; color: #fff; background: #292c25; font-size: 19px; }
    .switcher button:hover { background: #3a3e34; }
    .switch-copy { padding: 7px 13px 8px; border-inline: 1px solid #55584f; text-align: center; }
    .switch-copy strong { display: block; color: var(--accent); font-size: 13px; }
    .switch-copy span { display: block; margin-top: 1px; color: #d3d5cd; font-size: 11px; }

    @media (max-width: 920px) {
      .commandbar { flex-wrap: wrap; }
      .commandbar .source-entry { order: 3; flex-basis: 100%; }
      .workbench { display: block; }
      .filter-rail { display: flex; gap: 4px; overflow-x: auto; padding: 7px; border-right: 0; border-bottom: 1px solid var(--line-dark); }
      .filter-rail h2, .filter-rail .rail-rule, .filter-rail .rail-meta { display: none; }
      .filter-button { width: auto; min-width: max-content; }
      .inventory-pane { overflow-x: auto; }
      .inventory-table { min-width: 720px; }
      .details-pane { border-top: 1px solid var(--line-dark); border-left: 0; }
      .details-body { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .details-body .description, .details-body .confirm-step { grid-column: 1 / -1; }
      .source-task { grid-template-columns: 1fr auto; }
      .source-task > div:first-child { grid-column: 1 / -1; }
      .ledger-header { grid-template-columns: 1fr; gap: 11px; }
    }

    @media (max-width: 640px) {
      :root { font-size: 13px; }
      .app { padding-bottom: 102px; }
      .titlebar .prototype-tag { display: none; }
      .commandbar > .provider-note { width: 100%; }
      .details-body { display: block; }
      .queue-shell, .ledger-shell { padding-inline: 10px; }
      .queue-header { align-items: start; }
      .queue-header p, .queue-header .muted { display: none; }
      .source-task { grid-template-columns: 1fr; }
      .source-task > div:first-child { grid-column: auto; }
      .queue-controls { align-items: stretch; flex-direction: column; }
      .queue-controls .search-box { max-width: none; }
      .queue-item { grid-template-columns: 1fr; }
      .queue-actions { justify-content: start; }
      .queue-detail { grid-template-columns: 1fr; }
      .healthy-row { grid-template-columns: minmax(120px, 1fr) auto; }
      .healthy-row > :nth-child(2), .healthy-row > :nth-child(3) { display: none; }
      .ledger-add { display: grid; grid-template-columns: 1fr auto; }
      .ledger-tools { flex-wrap: wrap; }
      .ledger-tools .search-box { max-width: none; flex: 1 1 100%; }
      .ledger-tools .provider-note { margin-left: 0; }
      .ledger-column-head { display: none; }
      .source-head { grid-template-columns: 1fr auto; }
      .source-head > :nth-child(2), .source-head > :nth-child(3) { display: none; }
      .source-skill { grid-template-columns: 18px minmax(150px, 1fr) auto; gap: 7px; }
      .source-skill > :nth-child(3), .source-skill > :nth-child(4) { display: none; }
      .ledger-detail { grid-template-columns: 1fr; }
      .ledger-detail .action-row { justify-content: start; max-width: none; }
      .inspector { top: 2vh; right: 2vw; bottom: 98px; width: 96vw; }
      .candidate-row { grid-template-columns: 24px 1fr 80px; }
      .candidate-row small { display: none; }
      .inspection-summary { flex-wrap: wrap; }
      .switcher { bottom: 8px; width: calc(100vw - 16px); grid-template-columns: 38px 1fr 38px; }
      .switch-copy { padding-inline: 6px; }
    }
  </style>
</head>

          <div class="inspector-form"><input data-field="source" aria-label="Source URL to inspect" value="${escapeHtml(state.sourceUrl)}"><button class="btn primary" data-action="run-inspect">Inspect</button></div>
          ${state.inspected ? `
            <div class="inspection-summary"><strong>44 Skills found</strong><span>GitHub · branch <span class="mono">main</span> · checked now</span><span class="spacer"></span><button class="btn small" data-action="select-all-candidates">${state.allCandidatesSelected ? "Clear all" : "Select all 44"}</button></div>
            <div class="candidate-list" aria-label="Skills found in source">${state.candidates.filter(candidate => candidate.visible).map(candidate => `<div class="candidate-row"><label><input type="checkbox" data-action="toggle-candidate" data-id="${candidate.id}" ${candidate.selected ? "checked" : ""}><strong>${escapeHtml(candidate.name)}</strong><small class="mono">${escapeHtml(candidate.path)}</small><span class="tag">Installable</span></label></div>`).join("")}<div class="candidate-row"><span></span><strong>36 more Skills</strong><small>Select all to include the full inspected source.</small><span class="tag">Discovered</span></div></div>
            <div class="inspector-foot"><span class="provider-note">Microsoft APM CLI is not ready; this GitHub install is unaffected.</span><strong>${selectedCount} selected</strong><button class="btn primary" data-action="install-selected" ${selectedCount ? "" : "disabled"}>Install selected</button></div>`
            : `<div class="inspector-empty"><div><strong>Inspect before installing</strong><span>Skilly will normalize the source, enumerate stable Source Skill paths, and check collisions. Nothing is installed yet.</span><br><br><span class="mono">${escapeHtml(SOURCE_URL)}</span></div></div><div class="inspector-foot"><span class="provider-note">Provider readiness is advisory and does not block GitHub inspection.</span></div>`}
        </aside>`;
      }

      function switcher() {
        const current = variants[state.variant];
        return `<nav class="switcher" aria-label="Prototype variant switcher"><button data-action="previous-variant" aria-label="Previous variant">←</button><div class="switch-copy"><strong>${state.variant} · ${current.name}</strong><span>${current.description}</span></div><button data-action="next-variant" aria-label="Next variant">→</button></nav>`;
      }

      function render(preserveFocus = false) {
        let focusedField = null;
        let selectionStart = null;
        if (preserveFocus && document.activeElement && document.activeElement.dataset.field) {
          focusedField = document.activeElement.dataset.field;
          selectionStart = document.activeElement.selectionStart;
        }
        const app = document.getElementById("app");
        app.innerHTML = `${state.variant === "A" ? variantA() : state.variant === "B" ? variantB() : variantC()}${sourceInspector()}${switcher()}`;
        document.title = `Skilly prototype · ${state.variant} ${variants[state.variant].name}`;
        if (focusedField) {
          const target = app.querySelector(`[data-field="${focusedField}"]`);
          if (target) {
            target.focus();
            if (typeof target.setSelectionRange === "function" && selectionStart !== null) target.setSelectionRange(selectionStart, selectionStart);
          }
        }
      }

      function setOperation(label, message) {
        state.operation = { label, message, time: clock() };
      }

      function cycleVariant(direction) {
        const keys = Object.keys(variants);
        const index = keys.indexOf(state.variant);
        state.variant = keys[(index + direction + keys.length) % keys.length];
        const url = new URL(location.href);
        url.searchParams.set("variant", state.variant);
        history.replaceState(null, "", url);
        state.pending = null;
        setOperation("View changed", `${state.variant} · ${variants[state.variant].name}. Inventory state is shared across variants.`);
        render();
      }

      function selectSkill(id) {
        if (skillById(id)) {
          state.selectedId = id;
          state.pending = null;
          render();
        }
      }

      function removeSkill(id, label, message) {
        const index = state.skills.findIndex(skill => skill.id === id);
        if (index < 0) return;
        state.skills.splice(index, 1);
        state.selectedId = state.skills[Math.min(index, state.skills.length - 1)]?.id || "";
        state.pending = null;
        setOperation(label, message);
        render();
      }

      function installCandidates() {
        const selected = state.candidates.filter(candidate => candidate.selected);
        let installed = 0;
        selected.forEach(candidate => {
          if (skillById(candidate.id)) return;
          state.skills.push({
            id: candidate.id, name: candidate.name, description: candidate.description,
            management: "Managed", health: "Healthy", update: "Current", provider: "GitHub",
            source: "github.com/cursor/plugins", sourceLabel: "cursor/plugins", sourcePath: `pstack/skills/${candidate.path}`,
            tracking: "main", installed: "c92ea41", available: "c92ea41", installedDate: "2026-08-26", availableDate: "2026-08-26",
            path: `~/.agents/skills/${candidate.path}`, harnesses: [true, true, true, true]
          });
          installed += 1;
        });
        state.inspectorOpen = false;
        state.inspected = false;
        state.allCandidatesSelected = false;
        state.candidates.forEach(candidate => { candidate.selected = false; });
        if (installed) state.selectedId = selected.find(candidate => skillById(candidate.id))?.id || state.selectedId;
        setOperation("Install complete", `${installed} Skill${installed === 1 ? "" : "s"} installed to ~/.agents/skills and exposed to all four Harnesses; Claude Code uses its junction.`);
        render();
      }

      document.addEventListener("input", event => {
        const field = event.target.dataset.field;
        if (field === "search") {
          state.search = event.target.value;
          render(true);
        }
        if (field === "source") {
          state.sourceUrl = event.target.value;
          document.querySelectorAll('[data-field="source"]').forEach(input => { if (input !== event.target) input.value = state.sourceUrl; });
        }
      });

      document.addEventListener("click", event => {
        const target = event.target.closest("[data-action]");
        if (!target) return;
        const action = target.dataset.action;
        const id = target.dataset.id;

        if (action === "previous-variant") return cycleVariant(-1);
        if (action === "next-variant") return cycleVariant(1);
        if (action === "select") return selectSkill(id);
        if (action === "filter") { state.filter = target.dataset.filter; render(); return; }
        if (action === "sort") {
          if (state.sort === target.dataset.sort) state.sortDirection *= -1;
          else { state.sort = target.dataset.sort; state.sortDirection = 1; }
          render(); return;
        }
        if (action === "refresh") {
          state.refreshedAt = `Checked ${clock()}`;
          setOperation("Checks refreshed", "Read-only comparison completed: 1 update, 1 locally modified Skill, and 2 metadata problems remain.");
          render(); return;
        }
        if (action === "open-inspector") { state.inspectorOpen = true; state.inspected = false; render(); return; }
        if (action === "close-inspector") { state.inspectorOpen = false; render(); return; }
        if (action === "run-inspect") {
          state.inspected = true;
          setOperation("Source inspected", "44 Skills found at cursor/plugins pstack/skills. No installation changes made.");
          render(); return;
        }
        if (action === "toggle-candidate") {
          const candidate = state.candidates.find(item => item.id === id);
          if (candidate) candidate.selected = target.checked;
          state.allCandidatesSelected = state.candidates.every(item => item.selected);
          render(); return;
        }
        if (action === "select-all-candidates") {
          state.allCandidatesSelected = !state.allCandidatesSelected;
          state.candidates.forEach(candidate => { candidate.selected = state.allCandidatesSelected; });
          render(); return;
        }
        if (action === "install-selected") return installCandidates();
        if (action === "update") {
          const skill = skillById(id);
          if (!skill || skill.update !== "Update Available" || skill.health !== "Healthy") return;
          skill.installed = skill.available; skill.installedDate = skill.availableDate; skill.update = "Current";
          state.selectedId = id;
          setOperation("Update complete", `${skill.name} is Current at ${skill.installed}; four Harness Exposures remain healthy.`);
          render(); return;
        }
        if (action === "adopt") {
          const skill = skillById(id);
          if (!skill || skill.management !== "Verified Adoption Available" || !skill.verified) return;
          skill.management = "Managed"; skill.installedDate = "2026-08-26";
          state.selectedId = id;
          setOperation("Adoption complete", `${skill.name} is now Managed. Its existing content was not replaced; verified Provenance was recorded.`);
          render(); return;
        }
        if (action === "request-reinstall") {
          const skill = skillById(id);
          if (!skill || skill.management !== "Managed" || skill.health !== "Locally Modified") return;
          state.selectedId = id; state.pending = { type: "reinstall", id }; render(); return;
        }
        if (action === "confirm-reinstall") {
          const skill = skillById(id);
          if (!skill || state.pending?.type !== "reinstall") return;
          skill.health = "Healthy"; skill.update = "Current"; skill.installed = skill.available; skill.installedDate = "2026-08-26";
          state.pending = null;
          setOperation("Managed Reinstall complete", `${skill.name} local files were replaced with verified revision ${skill.installed}; Harness Exposures are Healthy.`);
          render(); return;
        }
        if (action === "uninstall") {
          const skill = skillById(id);
          if (!skill || skill.management !== "Managed" || skill.health !== "Healthy" || skill.update === "Update Available") return;
          return removeSkill(id, "Uninstall complete", `${skill.name} Management Record, canonical installation, and four Harness Exposures were removed.`);
        }
        if (action === "request-remove") {
          const skill = skillById(id);
          if (!skill || skill.management !== "Unmanaged") return;
          state.selectedId = id; state.pending = { type: "remove", id }; render(); return;
        }
        if (action === "confirm-remove") {
          const skill = skillById(id);
          if (!skill || skill.management !== "Unmanaged" || state.pending?.type !== "remove") return;
          return removeSkill(id, "Local folder removed", `${skill.path} was deleted. No Management Record existed.`);
        }
        if (action === "cancel-confirm") { state.pending = null; render(); return; }
        if (action === "toggle-source") {
          const key = target.dataset.sourceKey;
          if (state.expandedSources.has(key)) state.expandedSources.delete(key); else state.expandedSources.add(key);
          render();
        }
      });

      document.addEventListener("keydown", event => {
        const editable = event.target.matches("input, textarea, [contenteditable], [contenteditable='true']");
        if (!editable && event.key === "ArrowLeft") { event.preventDefault(); cycleVariant(-1); }
        if (!editable && event.key === "ArrowRight") { event.preventDefault(); cycleVariant(1); }
        if (!editable && (event.key === "Enter" || event.key === " ")) {
          const selectable = event.target.closest('[data-action="select"]');
          if (selectable) { event.preventDefault(); selectSkill(selectable.dataset.id); }
        }
        if (event.key === "Escape" && state.inspectorOpen) { state.inspectorOpen = false; render(); }
      });

      window.addEventListener("popstate", () => { state.variant = getVariant(); render(); });
      render();
    })();
  </script>
</body>
</html>
